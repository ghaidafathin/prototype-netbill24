<!DOCTYPE HTML>
<html lang="en">
    <head>
        <title> Forgot Password </title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>


    <body>
        <div class="min-h-screen flex justify-center items-center">
            <!-- DIV UTAMA -->
            <div class="w-[35%] h-auto bg-[#EAEAEA] flex flex-col items-center px-3 py-5">

                <!-- PLACEHOLDER EMAIL DAN KODE -->

                <!-- kolom atas (kirim kode ke email) -->
                <form class="self-start flex flex-col gap-2 items-start ml-[24px] mt-[10px]">
                    <div class="w-[320px]">
                        <label class="block font-mono font-bold text-[#2563EB] text-[15px]">
                            Type your registered email address:
                        </label>
                        <input
                        type="text"
                        placeholder="Enter your email address"
                        class="w-full border-2 border-[#2563EB] px-[15px] py-[3px] font-mono focus:outline-none focus:ring-1 focus:ring-[#1E3A8A]" />
                    </div>
                </form>

                <!-- OPSI KIRIM KODE KE EMAIL -->
                <div class="self-start ml-[24px] mt-[10px]">
                    <a href="" class="font-mono text-[#2563EB] italic underline"> Send Code to Email </a>
                </div>

                <!-- kolom bawah (kode verifikasi) -->
                <form class="self-start flex flex-col gap-2 items-start ml-[24px] mt-[15px]">
                    <div class="w-[320px]">
                        <label class="block font-mono font-bold text-[#2563EB] text-[15px]">
                            Type your verification code:
                        </label>
                        <input
                        type="text"
                        placeholder="Enter your code"
                        class="w-full border-2 border-[#2563EB] px-[15px] py-[3px] font-mono focus:outline-none focus:ring-1 focus:ring-[#1E3A8A]" />
                    </div>
                </form>

                <!-- OPSI RESEND CODE -->
                <div class="self-start ml-[24px] mt-[10px]">
                    <a href="" class="font-mono text-[#2563EB] italic underline"> Resend Code </a>
                </div>

                <!-- TOMBOL CONFIRM & BACK -->
                <div class="self-start flex flex-row justify-between w-[90%] mx-auto mt-[5px]">
                    <button class="mt-[15px] px-[20px] py-[4px] rounded-[5px] bg-[#2563EB] font-mono font-bold text-[#EAEAEA] text-[15px]">
                        <a href="changepw_forgot_member.html"> Confirm </a>
                    </button>
                    <button class="mt-[15px] px-[20px] py-[4px] rounded-[5px] bg-[#2563EB] font-mono font-bold text-[#EAEAEA] text-[15px]">
                        <a href="loginpage_member.html"> Back </a>
                    </button>
                </div>
            </div>
        </div>
    </body>

</html>
