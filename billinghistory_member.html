<!DOCTYPE HTML>
<html lang="en">
    <head>
        <title> Member: Billing History </title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body>

        <div class="min-h-screen flex justify-center items-center">
            <!-- DIV UTAMA -->
            <div class="w-[45%] h-auto bg-[#EAEAEA] px-8 py-5 flex flex-col items-center gap-5 shadow-md">

                <!-- TITLE BILLING HISTORIES -->
                <div class="flex flex-col gap-2 items-center">
                    <h1 class="font-mono font-bold text-[#2563EB] text-[25px] text-center"> [Billing Histories] </h1>
                    <span class="font-mono italic text-[#2563EB] text-[15px]"> Username: UserOne </span>
                </div>

                <!-- TABLE BILLING HISTORIES -->
                <table class="w-full border-collapse font-mono">
                    <!-- JUDUL TABLE -->
                    <thead>
                        <tr class="border-b-2 border-[#2563EB] text-[#2563EB] text-[15px]"> 
                            <th class="py-2 text-center"> Date </th>
                            <th class="py-2 text-center"> Duration </th>
                            <th class="py-2 text-center"> Amount </th>
                            <th class="py-2 text-center"> Status </th>
                        </tr>
                    </thead>
                    <!-- ISI TABLE -->
                    <tbody>
                        <tr class="border-b-2 border-[#2563EB] text-[#2563EB] text-[15px]">
                            <td class="py-2 text-center"> 24/12/2025 </td>
                            <td class="py-2 text-center"> 01:00:00 </td>
                            <td class="py-2 text-center"> Rp. 4.000,- </td>
                            <td class="py-2 text-center"> Success </td>
                        </tr>
                        <tr class="border-b-2 border-[#2563EB] text-[#2563EB] text-[15px]">
                            <td class="py-2 text-center"> 25/12/2025 </td>
                            <td class="py-2 text-center"> 03:00:00 </td>
                            <td class="py-2 text-center"> Rp. 12.000,- </td>
                            <td class="py-2 text-center"> Success </td>
                        </tr>
                        <tr class="border-b-2 border-[#2563EB] text-[#2563EB] text-[15px]">
                            <td class="py-2 text-center"> 28/12/2025 </td>
                            <td class="py-2 text-center"> 02:00:00 </td>
                            <td class="py-2 text-center"> Rp. 8.000,- </td>
                            <td class="py-2 text-center"> Success </td>
                        </tr>
                        <tr class="border-b-2 border-[#2563EB] text-[#2563EB] text-[15px]">
                            <td class="py-2 text-center"> 30/12/2025 </td>
                            <td class="py-2 text-center"> 05:00:00 </td>
                            <td class="py-2 text-center"> Rp. 20.000,- </td>
                            <td class="py-2 text-center"> Success </td>
                        </tr>
                    </tbody>
                </table>

                <!-- BACK BUTTON -->
                <button class="font-bold font-mono bg-[#2563EB] rounded-[5px] px-4 py-1 text-[#EAEAEA] text-[20px] shadow-md mt-[10px]">
                    <a href="dashboard_member.html"> Back </a>
                </button>

            </div>
        </div>

    </body>
</html>
