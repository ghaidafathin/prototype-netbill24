<!DOCTYPE HTML>
<html lang="en">
    <head>
        <title> Settings: Add New Admin </title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>


    <body>
        <div class="min-h-screen flex justify-center items-center">
            <!-- DIV UTAMA -->
            <div class="w-[35%] h-auto bg-[#EAEAEA] flex flex-col items-center px-3 py-5">
                <!-- HEADER -->
                <h1 class="font-mono font-bold text-[#1E3A8A] text-[20px]"> [ Add New Admin ] </h1>

                <!-- New Password -->
                <form class="mt-[10px]">
                    <label class="block font-mono font-bold text-[#1E3A8A] text-[15px]">
                        Username:
                    </label>
                    <div class="w-[320px]">
                        <input
                        type="text"
                        placeholder="Input your username"
                        class="w-full border-2 border-[#1E3A8A] px-[15px] py-[3px] font-mono focus:outline-none focus:ring-1 focus:ring-[#1E3A8A]" />
                    </div>

                    <label class="block font-mono font-bold text-[#1E3A8A] text-[15px]">
                        Password:
                    </label>
                    <div class="w-[320px]">
                        <input
                        type="text"
                        placeholder="Input your password"
                        class="w-full border-2 border-[#1E3A8A] px-[15px] py-[3px] font-mono focus:outline-none focus:ring-1 focus:ring-[#1E3A8A]" />
                    </div>

                    <label class="block font-mono font-bold text-[#1E3A8A] text-[15px]">
                        Email Address:
                    </label>
                    <div class="w-[320px]">
                        <input
                        type="text"
                        placeholder="input your email address"
                        class="w-full border-2 border-[#1E3A8A] px-[15px] py-[3px] font-mono focus:outline-none focus:ring-1 focus:ring-[#1E3A8A]" />
                    </div>
                </form>

                <!-- TOMBOL Apply & Cancel -->
                <div class="self-start flex flex-row justify-between w-[90%] mx-auto mt-[5px]">
                    <button class="mt-[15px] px-[20px] py-[4px] rounded-[5px] bg-[#1E3A8A] font-mono font-bold text-[#EAEAEA] text-[15px]">
                        <a href="dashboard_admin.html"> Apply </a>
                    </button>
                    <button class="mt-[15px] px-[20px] py-[4px] rounded-[5px] bg-[#1E3A8A] font-mono font-bold text-[#EAEAEA] text-[15px]">
                        <a href="settings.html"> Cancel </a>
                    </button>
                </div>
            </div>
        </div>
    </body>

</html>
