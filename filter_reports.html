<!DOCTYPE HTML>
<html lang="en">
    <head>
        <title> Reports: Filter </title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body>

        <div class="min-h-screen flex justify-center items-center">
            <!-- DIV UTAMA -->
            <div class="w-[35%] h-auto bg-[#EAEAEA] p-10 flex flex-col  gap-5 shadow-md">

                <!-- TITLE ACC INFO -->
                <p class="font-mono font-bold text-[#1E3A8A] text-[25px] text-center"> Filter Reports </p>
                <p class="font-mono text-[#1E3A8A] text-[20px] text-center"> Currently: All Reports </p>

                <!-- PILIHAN WAKTU -->
                <form>
                    <div class="flex flex-col items-center gap-2">
                        <label class="block font-mono font-bold text-[#1E3A8A] text-[15px]">
                            Select Time Range: 
                        </label>
                        <select class="w-full border-2 border-[#1E3A8A] px-[10px] py-[5px] font-mono focus:outline-none">
                            <option value=""> Time Range </option>
                            <option value=""> All Time </option>
                            <option value=""> Last Week </option>
                            <option value=""> Last Month </option>
                            <option value=""> Last 3 Months </option>
                            <option value=""> Last 6 Months </option>
                            <option value=""> Last Year </option>
                        </select>
                    </div>
                </form>

                <!-- OPSI TOMBOL -->
                <div class="flex flex-row justify-between gap-5">
                    <button class="font-bold font-mono bg-[#1E3A8A] rounded-[5px] px-4 py-1 text-[#EAEAEA] text-[20px] shadow-md mt-[10px]">
                        <a href="reports.html"> Cancel </a>
                    </button>
                    <button class="font-bold font-mono bg-[#1E3A8A] rounded-[5px] px-4 py-1 text-[#EAEAEA] text-[20px] shadow-md mt-[10px]">
                        <a href="reports.html"> Apply </a>
                    </button>
                </div>

            </div>
        </div>

    </body>
</html>
