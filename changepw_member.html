<!DOCTYPE HTML>
<html lang="en">
    <head>
        <title> Member: Change Password </title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

<body>
        <div class="min-h-screen flex justify-center items-center">
            <!-- DIV UTAMA -->
            <div class="w-[35%] h-auto bg-[#EAEAEA] flex flex-col items-center px-3 py-5">

                <!-- PLACEHOLDER PASSWORD BARU -->

                <!-- kolom atas (password lama) -->
                <form class="self-start flex flex-col gap-2 items-start ml-[24px] mt-[10px]">
                    <div class="w-[320px]">
                        <label class="block font-mono font-bold text-[#2563EB] text-[15px]">
                            Type your old password:
                        </label>
                        <input
                        type="text"
                        placeholder="your old password"
                        class="w-full border-2 border-[#2563EB] px-[15px] py-[3px] font-mono focus:outline-none focus:ring-1 focus:ring-[#1E3A8A]" />
                    </div>
                </form>

                <!-- kolom tengah (password baru) -->
                <form class="self-start flex flex-col gap-2 items-start ml-[24px] mt-[15px]">
                    <div class="w-[320px]">
                        <label class="block font-mono font-bold text-[#2563EB] text-[15px]">
                            Type your new password:
                        </label>
                        <input
                        type="text"
                        placeholder="your new password"
                        class="w-full border-2 border-[#2563EB] px-[15px] py-[3px] font-mono focus:outline-none focus:ring-1 focus:ring-[#1E3A8A]" />
                    </div>
                </form>

                <!-- kolom bawah (kode verifikasi) -->
                <form class="self-start flex flex-col gap-2 items-start ml-[24px] mt-[15px]">
                    <div class="w-[320px]">
                        <label class="block font-mono font-bold text-[#2563EB] text-[15px]">
                            Confirm your new password:
                        </label>
                        <input
                        type="text"
                        placeholder="your new password"
                        class="w-full border-2 border-[#2563EB] px-[15px] py-[3px] font-mono focus:outline-none focus:ring-1 focus:ring-[#1E3A8A]" />
                    </div>
                </form>

                <!-- TOMBOL APPLY & CANCEL -->
                <div class="self-start flex flex-row justify-between w-[90%] mx-auto mt-[5px]">
                    <button class="mt-[15px] px-[20px] py-[4px] rounded-[5px] bg-[#2563EB] font-mono font-bold text-[#EAEAEA] text-[15px]">
                        <a href="loginpage_member.html"> Apply </a>
                    </button>
                    <button class="mt-[15px] px-[20px] py-[4px] rounded-[5px] bg-[#2563EB] font-mono font-bold text-[#EAEAEA] text-[15px]">
                        <a href="accinfo_member.html"> Cancel </a>
                    </button>
                </div>
            </div>
        </div>
    </body>

</html>
